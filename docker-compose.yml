services:
  # Бэкенд сервер
  backend:
    image: node:20
    working_dir: /app
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - PORT=3001
    volumes:
      - .:/app
      - backend_node_modules:/app/node_modules
    command: sh -c "npm ci --no-audit --no-fund || npm install --no-audit --no-fund && npm run dev:server"
    restart: unless-stopped
    networks:
      - yoddle-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Фронтенд (Vite dev server)
  frontend:
    image: node:20
    working_dir: /app
    ports:
      - "5173:5173"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm ci --no-audit --no-fund || npm install --no-audit --no-fund && npm run dev"
    restart: unless-stopped
    networks:
      - yoddle-network
    depends_on:
      - backend

volumes:
  backend_node_modules:
  frontend_node_modules:

networks:
  yoddle-network:
    driver: bridge